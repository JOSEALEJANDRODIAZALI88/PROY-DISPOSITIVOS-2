project_id = "pacefit-integrante4"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
enable_signup = true
minimum_password_length = 10

[auth.email]
enabled = true
enable_confirmations = false

[auth.email.template.confirmation]
subject = "Confirma tu correo - PaceFit AI"
content_path = "./supabase/templates/confirmation.html"

[storage]
enabled = true
file_size_limit = "2MiB"

[functions.ai-gateway]
verify_jwt = false

[functions.city-submit]
verify_jwt = false

[functions.city-delete]
verify_jwt = false

[functions.account-delete]
verify_jwt = false
